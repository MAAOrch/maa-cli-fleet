# 让 headless profile 复用本机已登录的 DeepSeek 账号（与 desktop 同路由）。
#
# 用途：tools/dsh_mcp 派活时执行
#   dsh --profile headless --patch <本文件> --permission-mode ... --json -
#
# 背景（2026-11-23 本机实测）：
#   * headless 默认 agent-default-model = commandcode / deepseek/deepseek-v4.1-flash，
#     其 provider 解析 COMMANDCODE_API_KEY；本机未设置该环境变量 ->
#       MISSING_CREDENTIAL: no credential for provider route "commandcode"
#   * desktop profile 用的是 deepseek-account / deepseek-flash（本机已登录 DeepSeek 账号）；
#   * headless bundle 默认把 authorization / credentials / deepseek-account 三个插件
#     disabled 掉，所以只启用 deepseek-account 会报
#       ACCOUNT_SIGN_IN_REQUIRED / waiting for service: authorization。
#   本 overlay 按顺序重新启用三者，并把默认模型指回 deepseek-account/deepseek-flash。
#
# 如果以后改用环境变量 API Key（例如设置 COMMANDCODE_API_KEY），可删掉本文件，
# 或让 job_runner 不再传 --patch（见 README「凭据与模型」一节）。
- id: authorization
  disabled: false

- id: credentials
  disabled: false

- id: deepseek-account
  disabled: false

- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-flash
